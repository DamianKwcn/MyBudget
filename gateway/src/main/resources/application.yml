server:
  port: 8072

spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lowerCaseServiceId: true

      routes:
        - id: accounts
          uri: lb://ACCOUNTS
          predicates:
            - Path=/mybudget/accounts/**
          filters:
            - RewritePath=/mybudget/accounts/(?<s>.*), /${s}
            - name: CircuitBreaker
              args:
                name: accountsCircuitBreaker
                fallbackUri: forward:/contactSupport
                series:
                  - SERVER_ERROR
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 15
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: transactions
          uri: lb://TRANSACTIONS
          predicates:
            - Path=/mybudget/transactions/**
          filters:
            - RewritePath=/mybudget/transactions/(?<s>.*), /${s}
            - name: CircuitBreaker
              args:
                name: transactionsCircuitBreaker
                fallbackUri: forward:/contactSupport
                series:
                  - SERVER_ERROR
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 15
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: orchestrator
          uri: lb://ORCHESTRATOR
          predicates:
            - Path=/mybudget/api/orchestrator/**
          filters:
            - RewritePath=/mybudget/api/orchestrator/(?<s>.*), /api/orchestrator/${s}
            - name: CircuitBreaker
              args:
                name: orchestratorCircuitBreaker
                fallbackUri: forward:/contactSupport
                series:
                  - SERVER_ERROR
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 15
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:7080/realms/my-budget/protocol/openid-connect/certs"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

logging:
  level:
    com.mybudget.gatewayserver: DEBUG
    com.netflix.discovery: DEBUG
    com.mybudget.gateway.filter: DEBUG

resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      slowCallDurationThreshold: 3s
      slowCallRateThreshold: 30
      waitDurationInOpenState: 15000

info:
  app:
    name: "gatewayserver"
    description: "MyBudget Gateway Server Application"
    version: "0.0.1"
